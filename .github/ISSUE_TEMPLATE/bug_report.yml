name: Bug report
description: Report a reproducible MonitorMate problem without private data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Read Support and the current feature audit first. Do not post private settings, coordinates or raw logs. Use the repository Security tab to report vulnerabilities privately."
  - type: input
    id: version
    attributes:
      label: Version, package SHA-256 or source revision
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, version, architecture and display scale
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Monitor, connection and driver
      description: For Windows controls, include DDC/CI, HDR, multiple displays and the exact control-status message. Linux/macOS previews implement reminders only.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery and sanitized evidence
      description: Could you pause or exit normally? Include only reviewed nonprivate details.
