name: Feature request
description: Explain a concrete workflow MonitorMate should support.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing controls or alternatives considered
